[layout]
	#Scales the box width limit. Text still determines the actual width.
	box_width = 100
	#Scales vertical padding and row spacing without clipping text.
	box_height = 100
	#Minimum preferred space between info boxes.
	box_gap = 5
	#Space above the keyboard before the first box lane.
	top_gap = 17
	#Space below the keyboard before the first box lane.
	bottom_gap = 15
	#Space between the keyboard and side boxes.
	side_gap = 10
	#Higher values favor straighter lines. Lower values allow more turns.
	bend_cost = 18
	#Penalty for crossing another connector when a crossing is necessary.
	crossing_cost = 1400
	#Higher values discourage lines from running immediately beside each other.
	line_separation = 10
	#Keep assigned keys as routing obstacles, except the source key.
	avoid_keys = true
	#Try a crossing-free route first; allow crossings as a fallback.
	avoid_crossings = true
	#Use the existing smaller text and widths when many boxes are visible.
	auto_compact = true

