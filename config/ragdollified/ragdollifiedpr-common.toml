#Player revive settings
[revive]
	#Skip the downed state when you are alone in a local world, since nobody can revive you.
	#A world opened to LAN starts downing players again once a second player joins.
	#Default: true
	disableInSingleplayer = true
	#Stop downed players from using items, placing or breaking blocks, and interacting.
	#Attack stays blocked either way.
	#Default: true
	blockActionsWhileKnocked = true
	#A totem of undying held in either hand saves you from a fatal hit like vanilla instead of downing you.
	#Turn off to always down the player and leave the totem unused.
	#Default: true
	totemPreventsDowned = true
	#Seconds a downed player has before bleeding out.
	#Default: 60
	#Range: 5 ~ 3600
	downedSeconds = 60
	#Damage a downed player can take before dying.
	#Default: 50.0
	#Range: 1.0 ~ 10000.0
	knockedHealth = 50.0
	#Ticks after being downed during which a player loses no knocked health. 20 ticks is a second.
	#Whatever put them down is usually still going off - the rest of a burst, the fire it left,
	#the mob's next swing - and finishes them before anyone could reach them. 0 turns it off.
	#Default: 40
	#Range: 0 ~ 1200
	downedInvulnerableTicks = 40
	#Seconds of holding use on a downed player needed to revive them.
	#Default: 10
	#Range: 1 ~ 300
	reviveSeconds = 10
	#Seconds for a full revive bar to drain after reviving stops. Progress can be resumed while it drains.
	#Default: 30
	#Range: 1 ~ 3600
	reviveDecaySeconds = 30
	#Hearts of health a revived player gets back.
	#Default: 2.5
	#Range: 0.5 ~ 100.0
	reviveHearts = 2.5
	#Seconds after a revive before that player can be downed again. 0 disables the cooldown.
	#Default: 120
	#Range: 0 ~ 3600
	secondChanceCooldownSeconds = 120
	#Let a downed player hold jump to give up instead of waiting to bleed out.
	#Default: true
	allowGiveUp = true
	#Seconds jump has to be held to give up.
	#Default: 5
	#Range: 1 ~ 60
	giveUpSeconds = 5
	#Rust-style gamble: percent chance that giving up gets you back on your feet
	#(as if revived) instead of killing you. 0 turns it off, so giving up always kills.
	#Default: 0.0
	#Range: 0.0 ~ 100.0
	giveUpGetUpChance = 0.0
	#Let hostile mobs keep targeting and attacking a downed player.
	#Turn off and mobs lose interest the moment a player goes down.
	#Default: true
	mobsTargetDowned = true
	#Let players grab and drag a downed player's body.
	#Default: true
	allowDragging = true
	#Blocks a reviver can be from a downed body while reviving it.
	#Default: 2.5
	#Range: 1.0 ~ 5.0
	reviveRange = 2.5
	#Falling out of the world kills outright instead of downing the player.
	#Nobody can reach a body in the void to revive it.
	#Default: false
	voidSkipsDowned = false
